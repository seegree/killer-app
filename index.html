<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08120e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Killer">
  <meta name="description" content="Scorekeeper for Killer pool — 3 lives each, last one standing wins.">
  <title>Killer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2026.09.26.6">
</head>
<body>
  <!-- Shared SVG filter that gives marks a hand-drawn chalk wobble -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="chalk" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <main id="app"></main>

  <dialog id="sheet" aria-label="Options"></dialog>
  <div id="flash" aria-live="assertive"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <noscript><p style="padding:24px;color:#fff">Killer needs JavaScript turned on.</p></noscript>
  <!-- QR codes for live sharing load in the background so they never hold up the app -->
  <script async src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js" onload="window.dispatchEvent(new Event('killer:qr-ready'))"></script>
  <script src="app.js?v=2026.09.26.6"></script>
  <script type="module" src="live.js?v=2026.09.26.6"></script>
</body>
</html>
